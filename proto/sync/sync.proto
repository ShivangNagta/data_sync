syntax = "proto3";

package sync;

option go_package = "github.com/shivangnagta/data_sync/proto/sync";

message FileState {
  string path = 1;
  int64  size = 2;
  string hash = 3;
}

message GetSyncPlanRequest {
  repeated FileState local_files = 1;
}

message SyncAction {
  string path = 1;
  enum ActionType {
    DOWNLOAD = 0;
    UPLOAD = 1;
    DELETE = 2;
  }
  ActionType action = 2;
  string hash = 3;
  int64  size = 4;
}

message GetSyncPlanResponse {
  repeated SyncAction actions = 1;
}

message UploadFileRequest {
  oneof payload {
    UploadFileMeta meta = 1;
    bytes data = 2;
  }
}

message UploadFileMeta {
  string path = 1;
  int64  size = 2;
  string hash = 3;
}

message UploadFileResponse {
  bool accepted = 1;
  bool conflict = 2;
  string current_hash = 3;
}

message DownloadFileRequest {
  string path = 1;
}

message DownloadFileResponse {
  oneof payload {
    DownloadFileMeta meta = 1;
    bytes data = 2;
  }
}

message DownloadFileMeta {
  string path = 1;
  int64  size = 2;
  string hash = 3;
}

message DeleteFileRequest {
  string path = 1;
}

message DeleteFileResponse {
  bool deleted = 1;
}

service SyncService {
  rpc GetSyncPlan(GetSyncPlanRequest) returns (GetSyncPlanResponse);
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
}
